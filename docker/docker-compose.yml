# docker-compose -p concert up -d
version: '3.8'

services:
  mysql-db:
    image: mysql:8.0   # 안정적인 MySQL 8.0 버전 사용
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: zjxA8!9d*a
      MYSQL_DATABASE: hhplus
      MYSQL_USER: concert
      MYSQL_PASSWORD: d&xjzlAX7z@L
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.0    # 최신 안정 버전의 Redis 사용
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: [ "redis-server", "--appendonly", "yes" ]  # 데이터 영속성 활성화

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:2181"
    # Mac M chip 사용 시 아래 platform 추가
    platform: linux/amd64

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
